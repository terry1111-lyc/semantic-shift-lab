[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-shift-lab"
version = "0.2.0"
description = "A reproducible pilot for answer invariance and sensitivity in LLM reasoning"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.2,<3", "transformers>=4.56,<6", "accelerate>=1,<2", "peft>=0.14,<1"]

[project.scripts]
semantic-shift = "semantic_shift.cli:main"

[tool.setuptools.packages.find]
include = ["semantic_shift*"]
