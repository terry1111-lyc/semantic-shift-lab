name: Publish verified source upload
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-upload.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack release
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path, PurePosixPath
          archive = Path('semantic-shift-lab-v0.2.0.zip')
          expected = 'dab45e69b1a6a0f84726271bd312700687d377964dd16c14bcbaff2c3e1fc0d4'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(archive) as z:
              assert len(z.namelist()) == 148
              for item in z.infolist():
                  name = PurePosixPath(item.filename)
                  assert name.parts[0] == 'semantic-shift-lab'
                  assert '..' not in name.parts and '.git' not in name.parts
                  relative = Path(*name.parts[1:])
                  if relative.as_posix() == '.github/workflows/tests.yml':
                      continue
                  relative.parent.mkdir(parents=True, exist_ok=True)
                  relative.write_bytes(z.read(item))
          archive.unlink()
          PY
      - name: Verify actual research evidence
        run: python research/verify_results.py
      - name: Commit published files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Publish verified v0.2.0 source, research evidence and reports'
          git push origin HEAD:main
